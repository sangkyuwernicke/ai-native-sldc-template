name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # CLAUDE.md의 "검증 명령"과 동일하게 유지: 에이전트도 같은 명령으로 자체 검증한다
      - run: make lint
      - run: make test
      - run: make build

  # 설정/프롬프트 변경 회귀 방지용 eval 스위트 (인시던트마다 케이스 추가)
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: make evals
