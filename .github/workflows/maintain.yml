name: maintain
# Maintain 단계: 정기 점검 결과를 intent 이슈로 만들어 다시 파이프라인(Plan)으로 진입시킨다.
on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pip-audit -r requirements.txt -r requirements-dev.txt > audit.txt 2>&1
      - name: Open intent issue on findings
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 배경"
            echo "주간 의존성 보안 스캔에서 취약점이 발견되었습니다."
            echo
            echo "## 스캔 결과"
            echo '```'
            cat audit.txt
            echo '```'
            echo
            echo "## 기대 결과"
            echo "취약 의존성을 안전한 버전으로 올리고 CI를 통과시킨다."
            echo
            echo "@claude 위 내용을 분석해 plan 을 올리고, 승인 후 수정 PR을 만들어줘."
          } > body.md
          gh issue create --repo "${{ github.repository }}" \
            --title "[maintain] 의존성 취약점 ($(date +%F))" \
            --label "intent" --body-file body.md
